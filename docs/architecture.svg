<svg width="720" height="900" viewBox="0 0 720 900" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Arial, sans-serif">
  <rect width="720" height="900" fill="#F1F3F1"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#565B60" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="360" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#14181C">Document Intelligence Platform — Architecture</text>

  <line x1="340" y1="96" x2="340" y2="156" stroke="#565B60" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="212" x2="340" y2="272" stroke="#565B60" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="328" x2="340" y2="388" stroke="#565B60" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="444" x2="340" y2="504" stroke="#565B60" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="560" x2="340" y2="620" stroke="#565B60" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="676" x2="340" y2="736" stroke="#565B60" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M220,764 L160,764 L160,184 L220,184" fill="none" stroke="#565B60" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="100" y="466" text-anchor="middle" font-size="11" fill="#565B60">GET by</text>
  <text x="100" y="482" text-anchor="middle" font-size="11" fill="#565B60">name / list</text>

  <rect x="490" y="272" width="150" height="428" rx="8" fill="none" stroke="#D7DAD3" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="565" y="302" text-anchor="middle" font-size="13" font-weight="600" fill="#14181C">Cross-cutting</text>
  <text x="565" y="322" text-anchor="middle" font-size="11" fill="#565B60">Logging</text>
  <text x="565" y="340" text-anchor="middle" font-size="11" fill="#565B60">Exception handling</text>
  <text x="565" y="358" text-anchor="middle" font-size="11" fill="#565B60">(all layers)</text>

  <g>
    <rect x="220" y="40" width="240" height="56" rx="8" fill="#FFFFFF" stroke="#1B3A4B" stroke-width="1.2"/>
    <text x="340" y="63" text-anchor="middle" font-size="14" font-weight="600" fill="#14181C">Frontend</text>
    <text x="340" y="82" text-anchor="middle" font-size="11" fill="#565B60">HTML / CSS / JS client</text>
  </g>

  <g>
    <rect x="220" y="156" width="240" height="56" rx="8" fill="#FFFFFF" stroke="#1B3A4B" stroke-width="1.2"/>
    <text x="340" y="179" text-anchor="middle" font-size="14" font-weight="600" fill="#14181C">REST API (FastAPI)</text>
    <text x="340" y="198" text-anchor="middle" font-size="11" fill="#565B60">OpenAPI / Swagger docs</text>
  </g>

  <g>
    <rect x="220" y="272" width="240" height="56" rx="8" fill="#FFFFFF" stroke="#1E7A46" stroke-width="1.2"/>
    <text x="340" y="295" text-anchor="middle" font-size="14" font-weight="600" fill="#14181C">File validation</text>
    <text x="340" y="314" text-anchor="middle" font-size="11" fill="#565B60">Type, size, page count (PyMuPDF)</text>
  </g>

  <g>
    <rect x="220" y="388" width="240" height="56" rx="8" fill="#FFFFFF" stroke="#1E7A46" stroke-width="1.2"/>
    <text x="340" y="411" text-anchor="middle" font-size="14" font-weight="600" fill="#14181C">OCR / parsing</text>
    <text x="340" y="430" text-anchor="middle" font-size="11" fill="#565B60">Tesseract + perspective correction</text>
  </g>

  <g>
    <rect x="220" y="504" width="240" height="56" rx="8" fill="#FFFFFF" stroke="#1E7A46" stroke-width="1.2"/>
    <text x="340" y="527" text-anchor="middle" font-size="14" font-weight="600" fill="#14181C">LLM extraction</text>
    <text x="340" y="546" text-anchor="middle" font-size="11" fill="#565B60">Groq (openai/gpt-oss-120b) tool call</text>
  </g>

  <g>
    <rect x="220" y="620" width="240" height="56" rx="8" fill="#FFFFFF" stroke="#1E7A46" stroke-width="1.2"/>
    <text x="340" y="643" text-anchor="middle" font-size="14" font-weight="600" fill="#14181C">Financial validation</text>
    <text x="340" y="662" text-anchor="middle" font-size="11" fill="#565B60">Formula checks by document type</text>
  </g>

  <g>
    <rect x="220" y="736" width="240" height="56" rx="8" fill="#FFFFFF" stroke="#B8863B" stroke-width="1.2"/>
    <text x="340" y="759" text-anchor="middle" font-size="14" font-weight="600" fill="#14181C">Persistence</text>
    <text x="340" y="778" text-anchor="middle" font-size="11" fill="#565B60">SQLite (dev) / PostgreSQL (prod)</text>
  </g>

  <text x="360" y="830" text-anchor="middle" font-size="11" fill="#565B60">Hosted on Render — backend web service (Docker) + static frontend + managed PostgreSQL</text>
  <text x="360" y="850" text-anchor="middle" font-size="11" fill="#565B60">Free-tier LLM: Groq · Free-tier OCR: local Tesseract (best-tier model)</text>
</svg>
